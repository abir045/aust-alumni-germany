<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <clipPath id="fav-shield">
      <polygon points="6,6 58,6 58,45 42,59 22,59 6,45" />
    </clipPath>
  </defs>

  <!-- German Flag Stripes Inside Favicon Shield -->
  <g clip-path="url(#fav-shield)">
    <rect x="0" y="0" width="64" height="21" fill="#111111" />
    <rect x="0" y="21" width="64" height="21" fill="#DD0000" />
    <rect x="0" y="42" width="64" height="22" fill="#FFCC00" />
  </g>

  <!-- Inner Contrast Shield -->
  <polygon points="10,10 54,10 54,43 40,55 24,55 10,43" fill="#FFFFFF" opacity="0.95" />

  <!-- Shield Border -->
  <polygon points="6,6 58,6 58,45 42,59 22,59 6,45" 
           fill="none" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Top Roof Element -->
  <path d="M 14 17 C 24 17 27 12 32 12 C 37 12 40 17 50 17 L 50 20 L 14 20 Z" fill="#13753E"/>

  <!-- Compact AUST Monogram -->
  <text x="32" y="29" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="9" 
        font-weight="900" 
        letter-spacing="0.5" 
        text-anchor="middle" 
        fill="#111827">AUST</text>

  <!-- Iconic Gate Graphic -->
  <g transform="translate(32, 40)">
    <polygon points="-12,-8 -3,-6 -3,8 -12,10" fill="#13753E"/>
    <polygon points="12,-8 3,-6 3,8 12,10" fill="#13753E"/>
  </g>
</svg>
